# nss: check the build on every push, publish the demo and the CSS to GitLab Pages from main.
# Pages URL: https://niharokz.gitlab.io/nss/  (stylesheet at /nss.min.css)

image: python:3.13-alpine

stages: [test, deploy]

check:
  stage: test
  script:
    - python build.py --check
    - python -m unittest discover -s tests -v
    # dist/ is committed; fail if someone edited src/ without rebuilding
    - apk add --no-cache git >/dev/null
    - git diff --exit-code -- dist nss.css nss.min.css || (echo "Run 'python build.py' and commit dist/." && exit 1)

pages:
  stage: deploy
  script:
    - python build.py
    - mkdir -p public
    - cp dist/*.css public/
    - sed 's#\.\./dist/#./#' demo/index.html > public/index.html
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
